# 定时把上游 zai-org/ZCode 的更新合进本 fork，能干净合并且 CI 通过时自动开 PR。
#
# 为什么需要它：
#   - 上游约每周推一次快照。攒着合并会让冲突规模放大：实测攒两版是 13~14 处冲突，
#     每周合一次只有 1 处（且是纯追加的清单文件）；
#   - 定时任务负责「早发现 + 试合并 + 预验证」，人只需要处理真正冲突的那部分。
#
# 行为：
#   1. 把 machine-owned 分支 upstream-mirror 同步到上游 HEAD（用于随时查看本 fork 的
#      定制差异，见 docs/fork-maintenance.md）；
#   2. 尝试把 upstream/main 合并进当前 main：
#      - 干净合并 → 先在**合并结果上**跑 typecheck / lint / 全量单测，全绿才推
#        upstream/sync 分支并创建/更新 PR；CI 失败则不开 PR，运行变红，日志即原因；
#      - 有冲突   → 不开 PR：把冲突清单写进运行摘要并让本次运行变红（Issues 可用时同时开/追加 issue）。
#
# 已知限制：bot PR 不会出现在 PR 的 Checks 区——unit-tests.yml 已移除 pull_request
# 触发（机器人开的 PR 触发该事件会被 GitHub 标为 "Awaiting approval" 审批门，纯噪声）；
# CI 结果以本运行的 verify 步骤为准，人工只需确认定制域未受影响。
name: Upstream sync

on:
  schedule:
    # 每周一 06:00 UTC（北京时间 14:00）。与上游快照的发布节奏对齐。
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# 上游同步是串行的：两个并发任务同时推 upstream/sync 会互相覆盖。
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Detect, verify and stage upstream updates
    runs-on: ubuntu-latest
    # 试合并干净时还要跑完整 CI（pnpm install + adapters 构建 + typecheck + 全量单测），
    # 实测约 15 分钟；给足余量。
    timeout-minutes: 45

    env:
      UPSTREAM_URL: https://github.com/zai-org/ZCode.git
      SYNC_BRANCH: upstream/sync
      MIRROR_BRANCH: upstream-mirror
      ISSUE_TITLE: 上游同步需要手工解决冲突
      HUSKY: "0"
      # tsc -b 全仓构建的堆需求（与 unit-tests.yml 同值）；vitest 步骤单独降到 4GB。
      NODE_OPTIONS: --max-old-space-size=8192
      # electron postinstall 走 npmmirror（与 unit-tests.yml / build-desktop.yml 同一镜像）。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史计算 merge-base 与差异统计。
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          # 不要加 --tags：本 fork 存在与上游同名但指向不同提交的本地 tag（如 v3.15.1），
          # git 会以 "would clobber existing tag" 拒绝更新并让整个 fetch 以非零码退出。
          # 同步只需要 upstream/main。
          git fetch upstream main --prune

      - name: Update upstream-mirror branch
        # machine-owned 分支：只镜像上游 HEAD，不要在其上提交（下次同步会被强制覆盖）。
        run: |
          set -euo pipefail
          git push --force origin "refs/remotes/upstream/main:refs/heads/$MIRROR_BRANCH"
          echo "已同步 $MIRROR_BRANCH -> $(git rev-parse --short upstream/main)"

      - name: Detect new upstream commits
        id: detect
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "main 已包含上游全部提交，跳过。"
            exit 0
          fi
          echo "has_updates=true" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"
          # 合并前的 fork 版本号：官方更新日志按 (base, new] 的版本差取用。
          echo "base_version=$(grep -m1 '"version":' package.json | sed 's/.*: "\([^"]*\)".*/\1/')" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream/main | head -20 > /tmp/upstream-commits.txt
          echo "" >> /tmp/upstream-commits.txt
          git diff --stat HEAD...upstream/main | tail -1 >> /tmp/upstream-commits.txt
          cat /tmp/upstream-commits.txt

      - name: Attempt merge
        if: steps.detect.outputs.has_updates == 'true'
        id: merge
        run: |
          set -euo pipefail
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "试合并干净无冲突。"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/upstream-conflicts.txt
            echo "冲突文件："
            cat /tmp/upstream-conflicts.txt
            # 不在分支里留下冲突标记：回滚到 main 状态，由 issue 指引人工处理。
            git merge --abort
            git checkout -B "$SYNC_BRANCH" HEAD
          fi

      # 合并结果预验证（与 unit-tests.yml 同一套门槛）：全绿才开 PR，失败则运行变红
      # 且不推分支、不开 PR——把上游引入的构建/测试问题挡在人工介入之前。
      # 不加 continue-on-error：CI 红着的同步 PR 等于把上游的回归悄悄送进 main。
      - name: Setup pnpm for merged-result verification
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        uses: pnpm/action-setup@v4
        with:
          # 与 mise.toml / package.json 的 packageManager 保持一致。
          version: 10.33.2

      - name: Setup Node for merged-result verification
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        uses: actions/setup-node@v4
        with:
          # 与 mise.toml 的 node 版本保持一致。
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies for merged-result verification
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build CLI adapters package
        # 与 unit-tests.yml 同款：@zcode/adapters 的 "./storage" 子路径导出指向 dist，
        # root vitest 的部分单测经 bootstrap 源码引用它，必须先按拓扑序构建（含依赖）。
        # 必须从根 workspace 执行——apps/zcode-cli 内层 workspace 看不到根 packages/*。
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        run: pnpm --filter "@zcode/adapters..." run build

      - name: Typecheck merged result
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        run: pnpm typecheck

      - name: Lint merged result
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        run: pnpm lint

      - name: Unit tests on merged result
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        env:
          # 步骤级降到 4GB：vitest worker 继承 job 级 8GB 会在 16GB runner 上互相挤压
          # （详见 unit-tests.yml 同名注释）。typecheck / lint 仍用 job 级 8GB。
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:unit

      - name: Open or update sync pull request
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push --force origin "refs/heads/$SYNC_BRANCH:refs/heads/$SYNC_BRANCH"

          upstream_head=$(git rev-parse --short upstream/main)
          # 官方更新日志：合并后的版本号若高于 fork 原版本，从官方 update manifest /
          # GitHub Release 取该版本的更新说明贴进 PR（scripts/ci/official-release-notes.mjs，
          # 与桌面 autoUpdater 的官方说明回退同源）。拿不到（版本未发布说明/网络失败）时
          # 省略该节，不影响 PR 创建。
          new_version=$(grep -m1 '"version":' package.json | sed 's/.*: "\([^"]*\)".*/\1/')
          official_notes=""
          if [ "$new_version" != "${{ steps.detect.outputs.base_version }}" ]; then
            official_notes=$(node scripts/ci/official-release-notes.mjs --version "$new_version" 2>/dev/null || true)
          fi
          {
            echo "定时同步把上游 \`upstream/main\`（\`$upstream_head\`）合并进 \`main\`。"
            echo
            echo "试合并**无冲突**，且合并结果已在本 workflow 运行内通过 typecheck / lint / 全量单测。"
            echo "请人工确认定制域后合并："
            echo
            echo "- [ ] 确认定制域未受影响（NewAPI、便携数据目录、Lark CLI、PowerShell 7、composer 速率指标）"
            echo "- [ ] 扫一眼下方上游提交清单，留意与本地定制的交叉点"
            echo
            if [ -n "$official_notes" ]; then
              echo "## 官方更新日志（v$new_version）"
              echo
              echo "$official_notes"
              echo
              echo "> 来源：官方 update manifest / GitHub Release；本 PR 同时携带未单独发版的"
              echo "> 源码同步，完整改动以下方提交清单为准。"
              echo
            fi
            echo "本次带入的上游提交（最多 20 条）："
            echo
            echo '```'
            cat /tmp/upstream-commits.txt
            echo '```'
            echo
            echo "> 本 PR 由 \`upstream-sync\` workflow 创建，分支会被后续同步强制更新。"
            echo "> CI 在创建本 PR 的那次运行内执行；PR 的 Checks 区为空是有意设计"
            echo "> （unit-tests.yml 已移除 pull_request 触发，避免机器人 PR 的审批门）。"
          } > /tmp/pr-body.md

          # 全部走 REST（gh api）而不是 gh pr create/edit：本仓库实测（2026-11-04）
          # GITHUB_TOKEN 在 job 内声明了 pull-requests: write 且仓库已开启
          # 「Allow GitHub Actions to create and approve pull requests」后，REST
          # POST /pulls 成功，而 gh pr create 的 GraphQL createPullRequest 仍被
          # Resource not accessible by integration 拒绝且 gh pr list 偶发返回空，
          # 原因未查明；REST 三端点（list/create/patch）实测全部可靠，统一切换。
          # 注意 gh api 的 -f 在不显式给 -X 时默认按 POST 处理（GET 查询参数必须
          # 显式 -X GET，否则会变成一次缺 base 字段的 POST /pulls 直接 422）。
          # REST 的 head 过滤器格式是 user:branch（GITHUB_REPOSITORY 是 owner/repo，
          # 直接拼会变成 owner/repo:branch 永远匹配不到，list 恒为空）。
          existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls" -X GET \
            -f state=open -f head="${GITHUB_REPOSITORY%%/*}:$SYNC_BRANCH" \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" \
              -f title="chore(upstream): sync upstream $upstream_head" \
              -f body="$(cat /tmp/pr-body.md)"
            echo "已更新 PR #$existing"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="chore(upstream): sync upstream $upstream_head" \
              -f head="$SYNC_BRANCH" \
              -f base=main \
              -f body="$(cat /tmp/pr-body.md)"
          fi

      - name: Report conflicts
        if: steps.detect.outputs.has_updates == 'true' && steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          upstream_head=$(git rev-parse --short upstream/main)
          upstream_count=$(git rev-list --count HEAD..upstream/main)

          # 运行摘要始终可写：即使仓库关闭了 Issues，冲突也会出现在 Actions 的运行摘要里。
          {
            echo "## 上游同步需要手工解决冲突"
            echo
            echo "上游 \`upstream/main\`（\`$upstream_head\`）有 $upstream_count 个新提交，试合并存在冲突，未创建 PR。"
            echo
            echo "**冲突文件**"
            echo
            echo '```'
            cat /tmp/upstream-conflicts.txt
            echo '```'
            echo
            echo "**本次带入的上游提交（最多 20 条）**"
            echo
            echo '```'
            cat /tmp/upstream-commits.txt
            echo '```'
            echo
            echo '手工处理：`git fetch upstream main && git merge upstream/main`，'
            echo '合并要点见 docs/fork-maintenance.md。'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "上游 \`upstream/main\`（\`$upstream_head\`）有 $upstream_count 个新提交，但试合并存在冲突，未创建 PR。"
            echo
            echo "冲突文件："
            echo
            echo '```'
            cat /tmp/upstream-conflicts.txt
            echo '```'
            echo
            echo "本次带入的上游提交（最多 20 条）："
            echo
            echo '```'
            cat /tmp/upstream-commits.txt
            echo '```'
            echo
            echo "手工处理："
            echo
            echo '```bash'
            echo 'git fetch origin && git merge origin/main          # 先确保本地 main 最新'
            echo 'git remote add upstream https://github.com/zai-org/ZCode.git  # 若尚未添加'
            echo 'git fetch upstream main'
            echo 'git merge upstream/main                            # 逐个解决冲突'
            echo '```'
            echo
            echo "合并要点见 docs/fork-maintenance.md：追加型清单（test-ids、architecture-policy、"
            echo "package.json 脚本）两侧都保留；上游重构过的区域（侧栏、SettingsPage、index.ts）"
            echo "取上游结构再把本 fork 的插入点加回。"
          } > /tmp/issue-body.md

          # Issues 可能被仓库关闭（本 fork 当前就是关闭状态），失败不影响摘要，只记一条 warning。
          existing=$(gh issue list --search "$ISSUE_TITLE in:title" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md || echo "::warning::issue 评论失败（可能已关闭 Issues）"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file /tmp/issue-body.md || echo "::warning::issue 创建失败（可能已关闭 Issues）"
          fi

          # 让这次运行变红：有冲突却绿着，等于没人会注意到。
          echo "::error::上游同步存在冲突，需要手工合并（详见运行摘要）"
          exit 1
