# 单元测试与静态检查（typecheck / lint / vitest 单测）。
#
# 为什么用 CI 而不是本地跑：
#   - 本地 Windows 全量单测耗时 30 分钟以上且持续占用 CPU，影响其他工作；
#   - Linux runner 更快也更接近官方 CI 环境，能在合入前暴露平台差异问题；
#   - push / PR 自动触发，结果可追溯，避免"本机过了但环境不同"的盲区。
#
# 仅覆盖单测（test:unit 已排除 desktop e2e）；E2E 需要真实 Electron 窗口，
# 由专门的 e2e 流水线或本地 `pnpm test:e2e` 承担。
name: Unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# 同一 ref 的新推送取消旧运行，节省 runner 时间；单测没有产物依赖，可安全取消。
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: typecheck / lint / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HUSKY: "0"
      # tsc -b 全仓构建 + vitest 并发 worker 的堆需求远超 Node 默认 2GB，
      # 本地默认堆会 OOM（见本地合并 v3.15.1 时的实测）；runner 内存 16GB，给到 8GB。
      NODE_OPTIONS: --max-old-space-size=8192
      # electron 的 postinstall 会从 GitHub Releases 下载约 110MB 的运行时二进制，
      # 自托管 runner 直连 GitHub 经常 socket hang up，导致 pnpm install 整体失败；
      # 改走 npmmirror（与 build-desktop.yml 同一镜像）。Linux 上 desktop 的
      # postinstall 还会执行 electron-rebuild 下载 Electron 头文件，@electron/get
      # 同样遵循该变量，npmmirror 同时托管 headers，一处设置两处生效。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system test dependencies
        # 两类单测对 runner 系统环境有硬性前提，GitHub ubuntu-latest 已预装（apt 命中
        # 已装包为 no-op），精简自托管镜像（如 Gitea runner 的 Debian 容器）缺了会整批失败：
        #   1. procps：processTreeTerminator / zcodeStdioTransport 靠 `ps` 发现 detached
        #      后代进程；缺失时进程树回收单测 5 例全挂（grandchild 无法被回收）。
        #   2. Electron 运行库：desktopAgentBytecode 直接执行 node_modules 里的 electron
        #      二进制；缺 libnspr4 等共享库时 7 例全挂（error while loading shared libraries）。
        # 轻量 t64 改名（Ubuntu noble）分两段尝试：经典包名优先（jammy/focal/debian 及
        # 提供 Provides 的 noble），失败再试 t64 包名；仍失败退回仅必装集，让缺口在
        # 具体用例里显式暴露而不是静默跳过。
        if: runner.os == 'Linux'
        run: |
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "仅支持 apt 系镜像：请先安装 procps 与 Electron 运行库（libnspr4/libnss3 等）"
            exit 1
          fi
          SUDO=""
          if [ "$(id -u)" != "0" ]; then
            SUDO="sudo"
          fi
          $SUDO apt-get update -qq
          COMMON_PKGS="procps libnspr4 libnss3 libdrm2 libxkbcommon0 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxtst6 libgbm1"
          CLASSIC_PKGS="libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 \
            libglib2.0-0 libpango-1.0-0 libcairo2"
          T64_PKGS="libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libgtk-3-0t64 libglib2.0-0t64 libpango-1.0-0t64 libcairo2t64"
          $SUDO apt-get install -y --no-install-recommends $COMMON_PKGS $CLASSIC_PKGS ||
            $SUDO apt-get install -y --no-install-recommends $COMMON_PKGS $T64_PKGS ||
            $SUDO apt-get install -y --no-install-recommends $COMMON_PKGS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 mise.toml / package.json 的 packageManager 保持一致。
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 mise.toml 的 node 版本保持一致。
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI adapters package
        # @zcode/adapters 的 "./storage" 子路径导出指向 dist（构建产物）；root vitest 的
        # 部分单测（如 storagePreparationProtocol）经 bootstrap 源码引用它，CI 全新
        # 环境没有本地残留 dist，必须先构建（本地开发机因曾构建过而未暴露）。
        # 尾部 "..." 连带其 workspace 依赖（contracts/provider/shared 等，tsc 需要
        # 它们的 dist 类型）；必须从根 workspace 执行——apps/zcode-cli 自带的内层
        # workspace 看不到根 packages/* 下的依赖，只能展开出 3 个包。
        run: pnpm --filter "@zcode/adapters..." run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        env:
          # Bugfix: GitHub runner 上 vitest worker 线程继承 job 级 8GB 堆上限，4 个并发
          # worker 各自可涨到 8GB，16GB runner 内存互相挤压；实测一次全量跑（20061 用例
          # 全绿）仍有 worker 触顶被 Node 以 ERR_WORKER_OUT_OF_MEMORY 终止，整场判失败。
          # 步骤级降到 4GB：V8 在涨穿前提前 GC，物理内存峰值同步减半。typecheck / lint
          # 仍用 job 级 8GB（tsc -b 全仓构建需要，见上方注释）。
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:unit
