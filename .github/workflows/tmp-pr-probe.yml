# 临时探针（排查 upstream-sync 的 createPullRequest 403 后自删）：
# 同一 GITHUB_TOKEN 下分别尝试 REST 与 GraphQL 两条建 PR 通道，定位被拒的具体端点。
# 探针目标分支 upstream/sync 已存在且内容就是待同步的合并结果——若 REST 成功，
# 创建的就是真正的同步 PR（标题/正文按 upstream-sync 的格式），不是垃圾数据。
name: PR channel probe

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNC_BRANCH: upstream/sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Probe REST and GraphQL PR channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "== repo / token identity =="
          gh api repos/$GITHUB_REPOSITORY --jq '{full_name, fork, default_branch}'
          echo "== REST list (-X GET + GH_DEBUG，抓原始请求) =="
          GH_DEBUG=api gh api "repos/$GITHUB_REPOSITORY/pulls" -X GET \
            -f state=open -f head="$GITHUB_REPOSITORY:$SYNC_BRANCH" 2>&1 |
            grep -E "GET /|POST /|=> Request|=> Status|^\[|number" | head -25
          echo "== gh pr list (原实现，对照) =="
          GH_DEBUG=api gh pr list --head "$SYNC_BRANCH" --state open 2>&1 | grep -E "GET /|=> [0-9]|Status:" | head -10
          echo "== REST create (POST /pulls) =="
          upstream_head=$(git ls-remote https://github.com/$GITHUB_REPOSITORY "refs/heads/$SYNC_BRANCH" | cut -c1-7)
          if gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="chore(upstream): sync upstream $upstream_head (probe)" \
            -f head="$SYNC_BRANCH" \
            -f base="main" \
            -f body="REST 通道探针第二次验证（首次已建 PR #3，这次预期 422 already exists）。" 2>&1 | tail -3; then
            echo "REST_CREATE=OK"
          else
            echo "REST_CREATE=DENIED"
          fi
          echo "== gh pr create (原实现，GH_DEBUG 抓原始报文) =="
          GH_DEBUG=api gh pr create --base main --head "$SYNC_BRANCH" \
            --title "probe create" --body "x" 2>&1 | grep -E "POST /|=> [0-9]|Status:|message" | head -20
