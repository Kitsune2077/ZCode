# Gitea 侧的上游同步（方案 B）：本仓库自己的 Actions 定时检查 zai-org/ZCode，
# 演练合并，并在需要人工处理时开 issue。
#
# 为什么不默认自动改 main：
#   本仓库有两个远端（GitHub fork 与 Gitea）。若两边各自合并上游，会产生两个内容相同
#   但提交不同的 main，之后互相推送必然非快进，等于自己制造冲突。
#   默认模式只产出结论（能否干净合并 / 冲突文件清单），由人决定在哪一侧合并。
#
# 自主模式（UPSTREAM_SYNC_AUTOMERGE=1）为什么能保持双端一致：
#   在 Gitea 上生成**一个**合并提交，然后把**同一个 SHA** 推到 Gitea 与 GitHub 的 main，
#   两端历史完全相同，不存在分叉。代价是需要一个 GitHub 侧 PAT。
#
# 前置配置（Gitea 仓库设置里各做一次）：
#   Settings → Secrets：GITEA_TOKEN
#     需要 scope：write:repository（推分支/镜像）、write:issue（开 issue）。
#   Settings → Actions → Variables（可选）：UPSTREAM_SYNC_AUTOMERGE=1
#     开启后还需要 Secrets：GITHUB_PUSH_TOKEN
#     （GitHub PAT，repo 写权限；若合并会改动 .github/workflows/ 还需要 workflow scope）。
#
# 与 GitHub 侧 .github/workflows/upstream-sync.yml 的关系：互不依赖、幂等。
#   先合并的一侧完成后，另一侧下一轮检测到「已包含上游」直接跳过。
#
# Gitea 平台限制：schedule 只在默认分支（main）上生效。
name: Upstream sync (Gitea)

on:
  schedule:
    # 每周一 06:00（实例时区）。上游约每周推一次快照。
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 串行：两次同步同时写 main / upstream-mirror 会互相覆盖。
concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/zai-org/ZCode.git
  SYNC_BRANCH: upstream/sync
  MIRROR_BRANCH: upstream-mirror
  ISSUE_TITLE: 上游同步状态
  GITEA_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  GITEA_ACTOR: ${{ github.repository_owner }}
  AUTOMERGE: ${{ vars.UPSTREAM_SYNC_AUTOMERGE }}
  GITHUB_FORK_REPO: Kitsune2077/ZCode

jobs:
  sync:
    name: Detect and stage upstream updates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史算 merge-base 与差异统计。
          fetch-depth: 0

      - name: Prepare credentials
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::缺少 GITEA_TOKEN secret（需要 write:repository + write:issue）"
            exit 1
          fi
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions@noreply.local"
          # 用凭据助手代替把 token 拼进 remote URL，避免它出现在 git 的错误输出里。
          git config credential.helper "!f() { echo username=${GITEA_ACTOR}; echo password=${GITEA_TOKEN}; }; f"

      - name: Sync upstream
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_PUSH_TOKEN: ${{ secrets.GITHUB_PUSH_TOKEN }}
        run: |
          set -uo pipefail

          # 写 issue / 追加评论；优先 jq，退化为 python3，两者都没有则只告警（不影响其它流程）。
          report_issue() {
            local file="$1" body payload payload_comment existing
            body=$(cat "$file")
            if command -v jq >/dev/null 2>&1; then
              payload=$(jq -n --arg t "$ISSUE_TITLE" --arg b "$body" '{title:$t, body:$b}')
              payload_comment=$(jq -n --arg b "$body" '{body:$b}')
              existing=$(curl -sS -H "Authorization: token ${GITEA_TOKEN}" \
                "${GITEA_API}/issues?state=open&type=issues&limit=50" \
                | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t) | .number] | first // empty' 2>/dev/null || true)
            elif command -v python3 >/dev/null 2>&1; then
              payload=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "body": sys.stdin.read()}))' "$ISSUE_TITLE")
              payload_comment=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))')
              existing=$(curl -sS -H "Authorization: token ${GITEA_TOKEN}" \
                "${GITEA_API}/issues?state=open&type=issues&limit=50" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((i["number"] for i in d if i["title"]==sys.argv[1]), ""))' "$ISSUE_TITLE" 2>/dev/null || true)
            else
              echo "::warning::runner 既无 jq 也无 python3，跳过 issue 上报（结论见上方日志）"
              return 0
            fi
            if [ -n "${existing:-}" ]; then
              curl -sS -o /dev/null -X POST -H "Authorization: token ${GITEA_TOKEN}" \
                -H "Content-Type: application/json" -d "$payload_comment" \
                "${GITEA_API}/issues/${existing}/comments" \
                || echo "::warning::追加 issue 评论失败"
            else
              curl -sS -o /dev/null -X POST -H "Authorization: token ${GITEA_TOKEN}" \
                -H "Content-Type: application/json" -d "$payload" \
                "${GITEA_API}/issues" \
                || echo "::warning::创建 issue 失败"
            fi
          }

          # ---------- 1. 取上游 ----------
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          # 不加 --tags：本仓库有与上游同名但指向不同的本地 tag，会以 would clobber 拒绝并让 fetch 失败。
          if ! git fetch upstream main --prune; then
            echo "::error::拉取上游失败（runner 需能访问 github.com）"
            exit 1
          fi

          # ---------- 2. 维护 upstream-mirror（失败不致命：可能受分支保护限制） ----------
          if git push --force origin "refs/remotes/upstream/main:refs/heads/${MIRROR_BRANCH}" >/dev/null 2>&1; then
            echo "${MIRROR_BRANCH} -> $(git rev-parse --short upstream/main)"
          else
            echo "::warning::${MIRROR_BRANCH} 更新失败（检查分支保护/权限），继续同步流程"
          fi

          # ---------- 3. 是否已有新提交 ----------
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main 已包含上游全部提交，跳过。"
            exit 0
          fi
          upstream_head=$(git rev-parse --short upstream/main)
          upstream_count=$(git rev-list --count HEAD..upstream/main)
          git log --oneline HEAD..upstream/main | head -20 > /tmp/upstream-commits.txt
          echo "上游新提交 ${upstream_count} 个（HEAD..${upstream_head}）"

          # ---------- 4. 在临时分支上演练合并 ----------
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit upstream/main; then
            merge_clean=1
            merge_sha=$(git rev-parse --short HEAD)
            echo "演练合并：无冲突（${merge_sha}）"
          else
            merge_clean=0
            git diff --name-only --diff-filter=U > /tmp/upstream-conflicts.txt
            echo "演练合并：存在冲突"
            cat /tmp/upstream-conflicts.txt
            git merge --abort
            git checkout main
          fi

          # ---------- 5a. 冲突：开/追加 issue 并让本次运行变红 ----------
          if [ "$merge_clean" = "0" ]; then
            {
              echo "**冲突**：上游 \`upstream/main\`（\`${upstream_head}\`）有 ${upstream_count} 个新提交，演练合并存在冲突，未改动 main。"
              echo
              echo '```'
              cat /tmp/upstream-conflicts.txt
              echo '```'
              echo
              echo "**本次带入的上游提交（最多 20 条）**"
              echo
              echo '```'
              cat /tmp/upstream-commits.txt
              echo '```'
              echo
              echo "**手工处理**"
              echo
              echo '```bash'
              echo 'git fetch origin && git merge origin/main          # 先确保本地 main 最新'
              echo 'git remote add upstream https://github.com/zai-org/ZCode.git  # 若尚未添加'
              echo 'git fetch upstream main'
              echo 'git merge upstream/main                            # 逐个解决冲突'
              echo '```'
              echo
              echo "合并要点见 docs/fork-maintenance.md：追加型清单（test-ids、architecture-policy、"
              echo "package.json 脚本）两侧都保留；上游重构过的区域（侧栏、SettingsPage、index.ts）"
              echo "取上游结构再把本 fork 的插入点加回。"
            } > /tmp/report.md
            report_issue /tmp/report.md
            echo "::error::上游同步存在冲突，需要手工合并（详见 issue「${ISSUE_TITLE}」）"
            exit 1
          fi

          # ---------- 5b. 干净但未开启自主模式：只报告，不写 main ----------
          if [ "${AUTOMERGE:-}" != "1" ]; then
            {
              echo "**可干净合并**：上游 \`upstream/main\`（\`${upstream_head}\`）有 ${upstream_count} 个新提交，演练合并无冲突。"
              echo
              echo "当前是「只检测」模式（未设置变量 \`UPSTREAM_SYNC_AUTOMERGE=1\`），没有改动 main。"
              echo "请按 docs/fork-maintenance.md 在本地合并、验证后推送两个远端；"
              echo "或设置该变量 + \`GITHUB_PUSH_TOKEN\` secret 让本工作流自动合并。"
              echo
              echo "**本次带入的上游提交（最多 20 条）**"
              echo
              echo '```'
              cat /tmp/upstream-commits.txt
              echo '```'
              echo
              echo '```bash'
              echo 'git fetch origin && git remote add upstream https://github.com/zai-org/ZCode.git'
              echo 'git fetch upstream main && git merge upstream/main'
              echo '```'
            } > /tmp/report.md
            report_issue /tmp/report.md
            echo "只检测模式：已报告可干净合并，未改动 main。"
            exit 0
          fi

          # ---------- 5c. 自主模式：同一个合并提交推到两端 main ----------
          if [ -z "${GITHUB_PUSH_TOKEN:-}" ]; then
            echo "::error::UPSTREAM_SYNC_AUTOMERGE=1 需要 GITHUB_PUSH_TOKEN secret（GitHub 侧 PAT）"
            exit 1
          fi
          # 把演练分支上的合并提交变成 main，保证 Gitea 与 GitHub 拿到完全相同的 SHA。
          git checkout -B main "$merge_sha"
          if ! git push origin main; then
            echo "::error::推送 main 到 Gitea 失败（检查分支保护）"
            exit 1
          fi
          if ! git push "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${GITHUB_FORK_REPO}.git" main; then
            echo "::error::推送 main 到 GitHub fork 失败（检查 PAT 权限；改动 .github/workflows/ 需要 workflow scope）"
            exit 1
          fi
          {
            echo "**已自动合并**：上游 \`upstream/main\`（\`${upstream_head}\`）的 ${upstream_count} 个新提交无冲突合并为 \`${merge_sha}\`。"
            echo
            echo "同一个提交已同时推送到 Gitea 与 GitHub 的 main（两端历史一致）。"
            echo "GitHub 侧的 unit-tests 会随这次推送自动运行；请在本地 \`git fetch\` 后按"
            echo "docs/fork-maintenance.md 的验证清单复核。"
            echo
            echo '```'
            cat /tmp/upstream-commits.txt
            echo '```'
          } > /tmp/report.md
          report_issue /tmp/report.md
          echo "自主合并完成：main -> ${merge_sha}"
